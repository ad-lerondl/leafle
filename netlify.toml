[build]
  command = "bash scripts/netlify-build.sh"
  publish = "build/web"

[build.environment]
  FLUTTER_CHANNEL = "stable"

[[redirects]]
  from = "/privacy"
  to = "/privacy/"
  status = 301

[[redirects]]
  from = "/download"
  to = "/download/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200